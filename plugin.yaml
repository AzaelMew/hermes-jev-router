name: jev-router-inline
version: 0.1.0
description: Show and preserve an inline Jev model-routing decision for every Hermes turn
author: Jethro Jones
license: MIT
homepage: https://github.com/jethrojones/hermes-jev-router
tags: [routing, models, telegram, typesafe, jev]
requires_env: []
# One of JEV_API_KEY, TYPESAFE_API_KEY, or OPENROUTER_API_KEY must be set.
# OPENROUTER_API_KEY routes decisions through OpenRouter's Decisions endpoint.
provides_hooks:
  - pre_llm_call
provides_commands:
  - jev

